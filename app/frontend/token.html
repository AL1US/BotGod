<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Aiogram Agent</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <h1>Aiogram Agent</h1>
        <p>Проект готов и сохранен в {{ code_path }}.</p>
        <p>Теперь нужен только токен Telegram-бота.</p>
        <form action="/token" method="post">
            <label for="token">BOT_TOKEN</label>
            <br>
            <input id="token" name="token" type="password" required>
            <br>
            <button type="submit">Подтвердить токен</button>
        </form>
    </body>
</html>
